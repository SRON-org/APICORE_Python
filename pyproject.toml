[project]
name = "APICORE_Python"
version = "2.0.0"
description = "High-performance APICORE V1/V2 parser and validator"
readme = "README.md"
keywords = ["apicore", "json", "yaml", "toml", "validation", "parser"]
authors = [
    { name = "shu-shu-1", email = "3458222@qq.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: File Formats :: JSON",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.19.0",
    "orjson>=3.10.0",
    "ruamel.yaml>=0.18.10",
    "ruamel.yaml.clib>=0.2.12",
]

[project.scripts]
apicore-validate = "apicore.cli:main"
apicore-gui = "apicore.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "apicore"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
